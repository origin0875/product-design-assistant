# Style Preset: Minimal / Elegant
# PM-facing label: "簡約優雅"

name: minimal-elegant
label_for_pm: "簡約優雅"
use_case: ["內容型 App", "生活風格 / 美學導向產品", "高單價/精品服務", "閱讀型產品"]
keywords: [minimal, elegant, refined, quiet, premium]

principle:
  design_keywords: ["簡約", "優雅", "留白", "質感"]
  ux_principles:
    - "留白本身就是設計語言，不用邊框/陰影堆砌層次，靠間距與對齊建立層級"
    - "每個畫面只保留必要元素，非核心功能收進次層級，不平舖所有選項"
    - "色彩克制，用單一強調色而非多色系統來標示重點"
    - "動效緩慢而細緻，避免任何跳動感或高飽和瞬間變化"

color:
  primary:
    hue_range: [0, 0]          # near-neutral/monochrome default; brand color override still applies
    default_hex: "#1A1A1A"
  secondary:
    relation: "single accent hue, low saturation, used sparingly"
    default_hex: "#A68A64"
  neutral_scale: pure-gray
  # 每個語意色是五個角色，不是單一值。fill 是品牌校準值、永不因對比而改；
  # 要調整的是「怎麼用」。門檻與解析順序見 validators/contrast-check.md。
  semantic:
    success:
      fill:    "#3A7D5C"          # 品牌校準值，永不因對比而改
      graphic: "#3A7D5C"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#EAF5F0"          # 徽章/chip 底色
      text:    "#397B5B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#3A7D5C", fg: "#FFFFFF" }
    warning:
      fill:    "#A6822F"          # 品牌校準值，永不因對比而改
      graphic: "#A6822F"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#F8F3E7"          # 徽章/chip 底色
      text:    "#896B27"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#A6822F", fg: "#1A1A1A" }
    error:
      fill:    "#A6392F"          # 品牌校準值，永不因對比而改
      graphic: "#A6392F"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#F8E9E7"          # 徽章/chip 底色
      text:    "#A6392F"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#A6392F", fg: "#FFFFFF" }
    info:
      fill:    "#4A6E8A"          # 品牌校準值，永不因對比而改
      graphic: "#4A6E8A"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#EBF0F4"          # 徽章/chip 底色
      text:    "#4A6E8A"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#4A6E8A", fg: "#FFFFFF" }
  contrast_target: AA

typography:
  # scale_ratio 不在這裡。字級階梯是資訊設計，不是視覺調性：同一份資料表的重要性
  # 排序不會因為換個調性而改變，而級距一動，每一頁的行數、欄寬與斷行都會跟著變。
  # 由 preset-blender.md Step 4b 依產品類型與資訊密度解析。不要把它加回來。
  base_size_px: 16
  weight:
    display: 500
    h1: 500
    h2: 500
    h3: 500
    body: 400
    caption: 400
    button: 500
    label: 500
  letter_spacing_bias: wide
  line_height_bias: airy          # 留白是主張，行距是留白最大的一塊
  font_family:
    character: "低對比、細筆畫；display 用襯線做編輯感，內文維持無襯線的易讀性"
    latin: ["Source Serif 4"]           # display / h1 only
    latin_body: ["Manrope", "Source Sans 3"]
    cjk: ["Noto Sans TC"]
    cjk_display: ["Noto Serif TC"]      # 見 blender Step 4e 的雙字族成本規則
    system_only: ['-apple-system', "PingFang TC", "Microsoft JhengHei"]
    tabular_required: false
  numeric_typography: optional

spacing:
  base_unit: 8
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
  density: spacious

radius:
  scale_px: { sm: 0, md: 2, lg: 4, full: 999 }
  button: sm
  card: sm
  input: sm
  dialog: md
  bottom_sheet: md

elevation:
  style: flat
  levels: [0, 1, 2, 3]
  shadow_opacity_range: [0.02, 0.08]
  notes: "幾乎不用陰影；分隔靠留白與極細 1px 分隔線（divider），而非 elevation"

icon:
  style: outline
  stroke_width: 1
  grid_px: 24

component_bias:
  button_default_variant: outline
  secondary_button_style: text-only
  card_elevation_default: 0
  density: spacious

layout:
  page_padding: 24
  section_spacing: 48
  card_spacing: 24
  content_width_max_px: 840
  nav_structure_bias: "web: 極簡頂部列; mobile: 底部導航，圖示克制不用色塊"

extensions:
  finance:
    trigger_keywords: ["股票", "金融", "投資", "交易", "market", "stock", "trading", "finance"]
    # 方向不寫死。color 底下兩個是「色族」不是「方向」，由 market_convention 決定誰是漲：
    #   western     漲=綠 跌=紅
    #   east-asian  漲=紅 跌=綠（台灣、中國、日本、韓國等市場）
    # 預設值與確認方式見 preset-blender.md Step 3b。兩個色族的五個角色都各自驗過對比，
    # 所以對調不需要重驗，只是換一個指向。
    market_convention: western
    color:
      hue_green:
        fill:    "#3A7D5C"          # 品牌校準值，永不因對比而改
        graphic: "#3A7D5C"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#EAF5F0"          # 徽章/chip 底色
        text:    "#397B5B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#3A7D5C", fg: "#FFFFFF" }
      hue_red:
        fill:    "#A6392F"          # 品牌校準值，永不因對比而改
        graphic: "#A6392F"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8E9E7"          # 徽章/chip 底色
        text:    "#A6392F"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#A6392F", fg: "#FFFFFF" }
      chart_line: "#A68A64"   # 圖表線是「理解內容所必需」的圖形物件，適用 SC 1.4.11 ≥3:1
      chart_grid: "neutral-200"
      # 注意：east-asian 慣例下紅色代表「漲」，risk_high 再用紅會互相牴觸。
      # 該情況改用下方 risk_high_alt（燒橘），見 Step 3b。
      risk_high:
        fill:    "#A6392F"          # 品牌校準值，永不因對比而改
        graphic: "#A6392F"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8E9E7"          # 徽章/chip 底色
        text:    "#A6392F"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#A6392F", fg: "#FFFFFF" }
      risk_medium:
        fill:    "#A6822F"          # 品牌校準值，永不因對比而改
        graphic: "#A6822F"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8F3E7"          # 徽章/chip 底色
        text:    "#896B27"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#A6822F", fg: "#1A1A1A" }
      risk_low:
        fill:    "#3A7D5C"          # 品牌校準值，永不因對比而改
        graphic: "#3A7D5C"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#EAF5F0"          # 徽章/chip 底色
        text:    "#397B5B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#3A7D5C", fg: "#FFFFFF" }
      # east-asian 慣例下 risk_high 改用這個（紅色已被「漲」佔走）。燒橘與紅、琥珀都分得開。
      risk_high_alt:
        fill:    "#9A3412"
        graphic: "#9A3412"
        tint:    "#F8EBE7"
        text:    "#9A3412"
        action:  { bg: "#9A3412", fg: "#FFFFFF" }
    typography:
      numeric_typography: required
