# Style Preset: Friendly / Playful
# PM-facing label: "親和活潑"

name: friendly-playful
label_for_pm: "親和活潑"
use_case: ["消費型 App", "社群 / 社交產品", "生活風格 App", "面向一般大眾的服務"]
keywords: [friendly, playful, warm, approachable, energetic]

principle:
  design_keywords: ["親和", "活潑", "溫暖", "有溫度"]
  ux_principles:
    - "互動要給即時、討喜的回饋（完成動作要有肯定感），但不能拖慢操作"
    - "文案語氣口語化，元件視覺上呼應這個語氣（圓潤、不生硬）"
    - "空狀態/錯誤狀態用友善插圖與語氣化解挫折感，不要只是冷冰冰的文字"
    - "首要任務按鈕要顯眼、好按，降低使用門檻優先於資訊密度"

color:
  primary:
    hue_range: [15, 45]        # warm orange/coral default, brand color still overridable
    default_hex: "#FF6B4A"
  secondary:
    relation: "complementary of primary, softened"
    default_hex: "#3AB795"
  neutral_scale: warm-gray
  # 每個語意色是五個角色，不是單一值。fill 是品牌校準值、永不因對比而改；
  # 要調整的是「怎麼用」。門檻與解析順序見 validators/contrast-check.md。
  semantic:
    success:
      fill:    "#2FAE66"          # 品牌校準值，永不因對比而改
      graphic: "#2EA963"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#E7F8EF"          # 徽章/chip 底色
      text:    "#227F4B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#2FAE66", fg: "#2A241F" }
    warning:
      fill:    "#E2A33D"          # 品牌校準值，永不因對比而改
      graphic: "#C9871E"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#F8F2E7"          # 徽章/chip 底色
      text:    "#966516"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#E2A33D", fg: "#2A241F" }
    error:
      fill:    "#E5484D"          # 品牌校準值，永不因對比而改
      graphic: "#E5484D"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#F8E7E8"          # 徽章/chip 底色
      text:    "#D01E23"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#E12F35", fg: "#FFFFFF" }
    info:
      fill:    "#4C9AFF"          # 品牌校準值，永不因對比而改
      graphic: "#4495FF"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
      tint:    "#E7EFF8"          # 徽章/chip 底色
      text:    "#0065E7"          # 對 tint ≥4.5:1（故對 surface 亦達標）
      action:  { bg: "#4C9AFF", fg: "#2A241F" }
  contrast_target: AA

typography:
  # scale_ratio 不在這裡。字級階梯是資訊設計，不是視覺調性：同一份資料表的重要性
  # 排序不會因為換個調性而改變，而級距一動，每一頁的行數、欄寬與斷行都會跟著變。
  # 由 preset-blender.md Step 4b 依產品類型與資訊密度解析。不要把它加回來。
  base_size_px: 16
  weight:
    display: 800
    h1: 700
    h2: 700
    h3: 600
    body: 400
    caption: 400
    button: 700
    label: 500
  letter_spacing_bias: normal
  line_height_bias: relaxed       # 呼應 density: spacious，讀起來不壓迫
  font_family:
    character: "humanist，字腔開，字碗圓，呼應 radius.button: full 的圓潤"
    latin: ["Rubik", "Nunito Sans"]
    cjk: ["Noto Sans TC"]
    system_only: ['-apple-system', "PingFang TC", "Microsoft JhengHei"]
    tabular_required: false
    note: |
      中文沒有可直接從 Google Fonts 取用的圓體。真的需要圓體時是自架
      jf-openhuninn（開源），不要為了圓潤去對 Noto Sans TC 加 synthetic 效果。
  numeric_typography: optional

spacing:
  base_unit: 8
  scale: [4, 8, 12, 16, 24, 32, 40, 48]
  density: spacious

radius:
  scale_px: { sm: 8, md: 12, lg: 20, full: 999 }
  button: full            # pill buttons — signature of this preset
  card: lg
  input: md
  dialog: lg
  bottom_sheet: lg

elevation:
  style: pronounced
  levels: [0, 1, 2, 3]
  shadow_opacity_range: [0.08, 0.24]
  notes: "卡片用明顯陰影營造漂浮/可觸摸感，呼應活潑調性"

icon:
  style: filled
  stroke_width: 2
  grid_px: 24

component_bias:
  button_default_variant: solid-flat
  secondary_button_style: tonal
  card_elevation_default: 1
  density: spacious

layout:
  page_padding: 20
  section_spacing: 28
  card_spacing: 16
  content_width_max_px: 960
  nav_structure_bias: "web: 頂部+底部混合; mobile: 底部導航為主"

extensions:
  finance:
    trigger_keywords: ["股票", "金融", "投資", "交易", "market", "stock", "trading", "finance"]
    color:
      up:
        fill:    "#2FAE66"          # 品牌校準值，永不因對比而改
        graphic: "#2EA963"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#E7F8EF"          # 徽章/chip 底色
        text:    "#227F4B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#2FAE66", fg: "#2A241F" }
      down:
        fill:    "#E5484D"          # 品牌校準值，永不因對比而改
        graphic: "#E5484D"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8E7E8"          # 徽章/chip 底色
        text:    "#D01E23"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#E12F35", fg: "#FFFFFF" }
      chart_line: "#FF603D"   # 圖表線是「理解內容所必需」的圖形物件，適用 SC 1.4.11 ≥3:1
      chart_grid: "neutral-200"
      risk_high:
        fill:    "#E5484D"          # 品牌校準值，永不因對比而改
        graphic: "#E5484D"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8E7E8"          # 徽章/chip 底色
        text:    "#D01E23"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#E12F35", fg: "#FFFFFF" }
      risk_medium:
        fill:    "#E2A33D"          # 品牌校準值，永不因對比而改
        graphic: "#C9871E"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#F8F2E7"          # 徽章/chip 底色
        text:    "#966516"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#E2A33D", fg: "#2A241F" }
      risk_low:
        fill:    "#2FAE66"          # 品牌校準值，永不因對比而改
        graphic: "#2EA963"          # 圖示/圖表線/邊框 — SC 1.4.11 ≥3:1
        tint:    "#E7F8EF"          # 徽章/chip 底色
        text:    "#227F4B"          # 對 tint ≥4.5:1（故對 surface 亦達標）
        action:  { bg: "#2FAE66", fg: "#2A241F" }
    typography:
      numeric_typography: required
